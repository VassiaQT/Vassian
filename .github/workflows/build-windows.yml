name: Build Windows vassian.exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build vassian.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm --version=18.1.8 -y --allow-downgrade --no-progress

          # Locate the LLVM installation (Chocolatey usually installs to
          # C:\Program Files\LLVM, but layouts can differ between versions).
          $root = "C:\Program Files\LLVM"
          if (-not (Test-Path "$root\lib\LLVM-C.lib")) {
            Write-Host "LLVM-C.lib not found in default location, searching..."
            $found = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)" `
              -Recurse -Filter "LLVM-C.lib" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $root = Split-Path (Split-Path $found.FullName)
            }
          }

          if (-not (Test-Path "$root\lib\LLVM-C.lib")) {
            throw "LLVM-C.lib not found. LLVM was not installed correctly."
          }

          Write-Host "Using LLVM at: $root"
          & "$root\bin\clang-cl.exe" --version

          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$env:LLVM_ROOT_DIR/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$env:LLVM_ROOT_DIR/bin/clang-cl.exe" `
            -DLLVM_ROOT_DIR="$env:LLVM_ROOT_DIR" `
            -B build

      - name: Build vassian.exe
        shell: pwsh
        run: |
          cmake --build build --parallel 2

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build\src\vassian.exe")) {
            throw "vassian.exe was not produced"
          }
          if (-not (Test-Path "build\src\LLVM-C.dll")) {
            throw "LLVM-C.dll was not copied next to vassian.exe"
          }
          .\build\src\vassian.exe --version
          .\build\src\vassian.exe --help
          .\build\src\vassian.exe .\test.vas --emit-llvm -o out.ll
          if (-not (Test-Path "out.ll")) {
            throw "vassian.exe failed to compile test.vas"
          }

      - name: Package release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\src\vassian.exe dist\vassian.exe
          Copy-Item build\src\LLVM-C.dll dist\LLVM-C.dll
          Compress-Archive -Path dist\vassian.exe, dist\LLVM-C.dll `
            -DestinationPath vassian-windows-x64.zip -Force

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^v?\d+\.\d+\.\d+') { $version = "0.1.0" }
          $version = $version.TrimStart('v')

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem "C:\Program Files*" -Recurse -Filter ISCC.exe `
              -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found, installing via Chocolatey..."
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup (ISCC.exe) was not found on the runner."
          }

          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist" "installer\vassian.iss"
          if (-not (Test-Path "dist\vassian-$version-windows-x64-setup.exe")) {
            throw "The Vassian installer was not produced."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vassian-windows-x64
          path: |
            dist/vassian.exe
            dist/LLVM-C.dll
            dist/vassian-*-windows-x64-setup.exe
            vassian-windows-x64.zip
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vassian.exe
            dist/LLVM-C.dll
            dist/vassian-*-windows-x64-setup.exe
            vassian-windows-x64.zip
          name: Vassian ${{ github.ref_name }} (Windows)
          draft: false
          prerelease: false
