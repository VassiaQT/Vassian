name: Build Windows vassian.exe

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build vassian.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM via Chocolatey
        run: |
          choco install llvm -y --version 18.1.8 --allow-downgrade --force
          
          # Search for llvm-config.exe in all possible locations
          $llvmPath = $null
          $searchPaths = @(
            "C:\Program Files\LLVM\bin\llvm-config.exe",
            "C:\Program Files (x86)\LLVM\bin\llvm-config.exe",
            "$env:ProgramFiles\LLVM\bin\llvm-config.exe",
            "$env:ProgramFiles(x86)\LLVM\bin\llvm-config.exe",
            "$env:ChocolateyInstall\lib\llvm\tools\bin\llvm-config.exe",
            "$env:ChocolateyInstall\bin\llvm-config.exe",
            "C:\Tools\LLVM\bin\llvm-config.exe"
          )
          
          foreach ($p in $searchPaths) {
            if (Test-Path $p) { 
              $llvmPath = $p
              Write-Host "Found llvm-config at: $p"
              break 
            }
          }
          
          # If still not found, search recursively
          if (-not $llvmPath) {
            Write-Host "Searching for llvm-config.exe..."
            $found = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)", "$env:ChocolateyInstall" -Recurse -Filter "llvm-config.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $llvmPath = $found.FullName }
          }
          
          if (-not $llvmPath) {
            Write-Error "llvm-config.exe not found after LLVM install"
            Write-Host "Searched paths:"
            $searchPaths | ForEach-Object { Write-Host "  $_ - $(if (Test-Path $_) { 'EXISTS' } else { 'NOT FOUND' })" }
            exit 1
          }
          
          Write-Host "LLVM found at: $llvmPath"
          & $llvmPath --version
          $clangPath = Join-Path (Split-Path $llvmPath) "clang.exe"
          & $clangPath --version
          $llvmDir = Join-Path (Split-Path (Split-Path $llvmPath)) "lib\cmake\llvm"
          Write-Host "LLVM_DIR = $llvmDir"
          echo "LLVM_DIR=$llvmDir" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Configure CMake
        run: |
          # Unset any pre-existing LLVM_DIR from runner environment (e.g., Android NDK)
          $env:LLVM_DIR = $null
          
          # Use LLVM_DIR from previous step (set via GITHUB_ENV)
          $llvmDir = $env:LLVM_DIR
          Write-Host "Using LLVM_DIR from env: $llvmDir"
          
          if (-not (Test-Path "$llvmDir\LLVMConfig.cmake")) {
            Write-Error "LLVMConfig.cmake not found in $llvmDir"
            Write-Host "Trying fallback search..."
            # Fallback: search common locations
            $altPaths = @(
              "C:\Program Files\LLVM\lib\cmake\llvm",
              "C:\Program Files (x86)\LLVM\lib\cmake\llvm",
              "$env:ProgramFiles\LLVM\lib\cmake\llvm",
              "$env:ProgramFiles(x86)\LLVM\lib\cmake\llvm"
            )
            foreach ($p in $altPaths) {
              if (Test-Path "$p\LLVMConfig.cmake") { 
                $llvmDir = $p
                Write-Host "Found LLVMConfig.cmake at: $llvmDir"
                break 
              }
            }
          }
          
          if (-not (Test-Path "$llvmDir\LLVMConfig.cmake")) {
            Write-Error "LLVMConfig.cmake not found in any location"
            exit 1
          }
          
          # Try VS 17 2022 first
          $result = cmake -G "Visual Studio 17 2022" -A x64 `
                -DCMAKE_BUILD_TYPE=Release `
                -DLLVM_DIR="$llvmDir" `
                -B build 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "VS generator failed, trying Ninja with clang-cl..."
            Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
            cmake -G "Ninja" `
                  -DCMAKE_BUILD_TYPE=Release `
                  -DCMAKE_C_COMPILER=clang-cl `
                  -DCMAKE_CXX_COMPILER=clang-cl `
                  -DLLVM_DIR="$llvmDir" `
                  -B build
          }
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          LLVM_DIR: ""

      - name: Build vassian.exe
        run: |
          cmake --build build --config Release --parallel 2
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: Verify executable
        run: |
          .\build\src\Release\vassian.exe ..\test.vas 2>&1 || echo "Build successful (test may not have --help)"
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: Copy LLVM runtime DLLs
        run: |
          cd build\src\Release
          $llvmBin = Join-Path (Split-Path $env:LLVM_DIR) "bin"
          if (Test-Path $llvmBin) {
            copy "$llvmBin\*.dll" .
          } else {
            Write-Host "LLVM bin not found at $llvmBin, trying to find llvm-config..."
            $llvmConfig = Get-Command llvm-config.exe -ErrorAction SilentlyContinue
            if ($llvmConfig) {
              $llvmBin = Split-Path $llvmConfig.Source
              copy "$llvmBin\*.dll" .
            } else {
              Write-Warning "Could not find LLVM bin directory, skipping DLL copy"
            }
          }
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: Upload vassian.exe + DLLs
        uses: actions/upload-artifact@v4
        with:
          name: vassian-windows-x64
          path: |
            build/src/Release/vassian.exe
            build/src/Release/*.dll
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/src/Release/vassian.exe
            build/src/Release/*.dll
          tag_name: ${{ github.ref_name }}
          name: Vassian ${{ github.ref_name }}
          draft: false
          prerelease: false